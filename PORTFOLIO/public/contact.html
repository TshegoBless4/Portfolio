<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Tshegofatso Mokone - UI/UX Portfolio</title>
    <link rel="stylesheet" href="/style.css">
    <!-- EmailJS SDK -->
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
</head>
<body>

<nav>
    <div class="container nav-container">
        <div class="logo">
            <a href="/">TM</a>
        </div>
        <ul class="nav-links">
            <li><a href="/">Home</a></li>
            <li><a href="/work">Work</a></li>
            <li><a href="/contact" class="active">Contact</a></li>
        </ul>
        <div class="hamburger">
            <span></span><span></span><span></span>
        </div>
    </div>
</nav>

<section class="contact-section">
    <div class="container">
        <h1 class="page-title">Get In Touch</h1>
        <p class="page-subtitle">Have a project in mind? Let's talk.</p>
        
        <div class="contact-grid">
            <div class="contact-info">
                <h2>Let's connect</h2>
                <p>I'm currently open to junior UI/UX roles, freelance projects, and collaboration opportunities.</p>
                
                <div class="contact-details">
                    <div class="contact-item">
                        <span class="contact-icon">📧</span>
                        <a href="mailto:Tshegofatsomokone316@gmail.com">Tshegofatsomokone316@gmail.com</a>
                    </div>
                    <div class="contact-item">
                        <span class="contact-icon">🐙</span>
                        <a href="#" target="_blank">GitHub</a>
                    </div>
                </div>
            </div>
            
            <div class="contact-form">
                <form id="contactForm">
                    <div class="form-group">
                        <label for="name">Your Name</label>
                        <input type="text" id="name" name="from_name" required>
                    </div>
                    <div class="form-group">
                        <label for="email">Your Email</label>
                        <input type="email" id="email" name="from_email" required>
                    </div>
                    <div class="form-group">
                        <label for="message">Message</label>
                        <textarea id="message" name="message" rows="5" required></textarea>
                    </div>
                    <button type="submit" id="submitBtn" class="btn-primary">Send Message</button>
                    <p id="formStatus" class="form-status"></p>
                </form>
            </div>
        </div>
    </div>
</section>

<footer>
    <div class="container">
        <p id="copyright"></p>
    </div>
</footer>

<script>
    // ============================================
    // EMAILJS CONTACT FORM
    // ============================================
    // 🔴 REPLACE THESE THREE VALUES with your actual keys from EmailJS:
    const EMAILJS_PUBLIC_KEY = "Bf_BoJDSj6ZwSr78L";      // From Account → API Keys
    const EMAILJS_SERVICE_ID = "service_us4eilv";      // From Email Services
    const EMAILJS_TEMPLATE_ID = "template_c3w29gp";    // From Email Templates
    
    // Initialize EmailJS
    emailjs.init({
        publicKey: EMAILJS_PUBLIC_KEY,
    });
    
    // Get form elements
    const form = document.getElementById('contactForm');
    const submitBtn = document.getElementById('submitBtn');
    const formStatus = document.getElementById('formStatus');
    const copyrightYear = document.getElementById('copyright');
    
    // Handle form submission
    if (form) {
        form.addEventListener('submit', async function(event) {
            event.preventDefault();
            
            // Show loading state
            const originalButtonText = submitBtn.textContent;
            submitBtn.textContent = 'Sending...';
            submitBtn.disabled = true;
            formStatus.textContent = '';
            
            try {
                // Send email via EmailJS
                const response = await emailjs.sendForm(
                    EMAILJS_SERVICE_ID,
                    EMAILJS_TEMPLATE_ID,
                    this
                );
                
                // Success!
                formStatus.textContent = '✓ Message sent successfully! I will respond within 24 hours.';
                formStatus.style.color = 'green';
                form.reset();
                
            } catch (error) {
                console.error('EmailJS Error:', error);
                formStatus.textContent = '⚠️ Failed to send. Please email me directly: Tshegofatsomokone316@gmail.com';
                formStatus.style.color = 'red';
            } finally {
                // Reset button
                submitBtn.textContent = originalButtonText;
                submitBtn.disabled = false;
            }
        });
    }
    
    // Copyright year
    if (copyrightYear) {
        copyrightYear.innerHTML = `© ${new Date().getFullYear()} Tshegofatso Mokone | Designed with purpose`;
    }
    
    // Mobile hamburger menu
    const hamburger = document.querySelector('.hamburger');
    const navLinks = document.querySelector('.nav-links');
    if (hamburger && navLinks) {
        hamburger.addEventListener('click', () => {
            navLinks.classList.toggle('active');
        });
    }
</script>

</body>
</html>
