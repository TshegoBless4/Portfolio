<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Tshegofatso Mokone - UI/UX Portfolio</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>

<nav>
    <div class="container nav-container">
        <div class="logo">
            <a href="/">TM</a>
        </div>
        <ul class="nav-links">
    <li><a href="/">About</a></li>
    <li><a href="/work" class="active">Work</a></li>
    <li><a href="/contact">Contact</a></li>
</ul>
        <div class="hamburger">
            <span></span><span></span><span></span>
        </div>
    </div>
</nav>

<section class="contact-section">
    <div class="container">
        <h1 class="page-title">Get In Touch</h1>
        <p class="page-subtitle">Have a project in mind? Let's talk.</p>
        
        <div class="contact-grid">
            <div class="contact-info">
                <h2>Let's connect</h2>
                <p>I'm currently open to junior UI/UX roles, freelance projects, and collaboration opportunities.</p>
                
                <div class="contact-details">
                    <div class="contact-item">
                        <span class="contact-icon">📧</span>
                        <a href="mailto:Tshegofatsomokone316@gmail.com">Tshegofatsomokone316@gmail.com</a>
                    </div>
                    <div class="contact-item">
                        <span class="contact-icon">🐙</span>
                        <a href="#" target="_blank">GitHub</a>
                    </div>
                </div>
            </div>
            
            <div class="contact-form">
                <form id="contactForm">
                    <div class="form-group">
                        <label for="name">Name</label>
                        <input type="text" id="name" name="name" required>
                    </div>
                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" required>
                    </div>
                    <div class="form-group">
                        <label for="message">Message</label>
                        <textarea id="message" name="message" rows="5" required></textarea>
                    </div>
                    <button type="submit" class="btn-primary">Send Message</button>
                    <p id="formStatus" class="form-status"></p>
                </form>
            </div>
        </div>
    </div>
</section>

<footer>
    <div class="container">
        <p id="copyright"></p>
    </div>
</footer>

<script>
    // Contact form handler
    const contactForm = document.getElementById('contactForm');
    const formStatus = document.getElementById('formStatus');
    
    if (contactForm) {
        contactForm.addEventListener('submit', (e) => {
            e.preventDefault();
            
            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;
            const message = document.getElementById('message').value;
            
            if (name && email && message) {
                formStatus.textContent = 'Thanks! Redirecting to your email client...';
                formStatus.style.color = 'green';
                window.location.href = `mailto:Tshegofatsomokone316@gmail.com?subject=Portfolio message from ${encodeURIComponent(name)}&body=${encodeURIComponent(message)}%0A%0A- From: ${encodeURIComponent(name)} (${encodeURIComponent(email)})`;
                contactForm.reset();
            } else {
                formStatus.textContent = 'Please fill out all fields.';
                formStatus.style.color = 'red';
            }
        });
    }
    
    // Copyright year
    document.getElementById('copyright').innerHTML = `© ${new Date().getFullYear()} Tshegofatso Mokone | Designed with purpose`;
    
    // Mobile hamburger menu
    const hamburger = document.querySelector('.hamburger');
    const navLinks = document.querySelector('.nav-links');
    if (hamburger && navLinks) {
        hamburger.addEventListener('click', () => {
            navLinks.classList.toggle('active');
        });
    }
</script>

</body>
</html>
